<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ola's Fastfood - Admin Dashboard</title>

    <style>

        /* =========================
           GENERAL PAGE
        ========================= */

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background-color: #f5f5f5;

            color: #333;

        }


        /* =========================
           HEADER
        ========================= */

        header {

            background-color: #8b0000;

            color: white;

            padding: 20px 30px;

        }


        .header-content {

            max-width: 1300px;

            margin: auto;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

        }


        header h1 {

            margin: 0;

            font-size: 30px;

        }


        header p {

            margin: 6px 0 0;

            font-size: 15px;

        }


        /* =========================
           LOGOUT BUTTON
        ========================= */

        #logoutButton {

            background-color: white;

            color: #8b0000;

            border: none;

            padding: 10px 16px;

            border-radius: 6px;

            cursor: pointer;

            font-weight: bold;

        }


        #logoutButton:hover {

            background-color: #f0f0f0;

        }


        /* =========================
           DASHBOARD
        ========================= */

        .dashboard {

            padding: 30px;

            max-width: 1300px;

            margin: auto;

        }


        /* =========================
           NOTIFICATION
        ========================= */

        #notification {

            display: none;

            background-color: #fff3cd;

            color: #856404;

            border: 1px solid #ffeeba;

            padding: 15px;

            border-radius: 8px;

            margin-bottom: 20px;

            font-weight: bold;

        }


        /* =========================
           STATISTICS
        ========================= */

        .stats {

            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 20px;

            margin-bottom: 30px;

        }


        .stat-card {

            background-color: white;

            padding: 25px;

            border-radius: 12px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.1);

            text-align: center;

        }


        .stat-card h2 {

            margin: 0;

            font-size: 30px;

            color: #8b0000;

        }


        .stat-card p {

            margin-bottom: 0;

            font-size: 15px;

        }


        /* =========================
           ORDERS SECTION
        ========================= */

        .orders-container {

            background-color: white;

            padding: 25px;

            border-radius: 12px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.1);

        }


        .orders-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            flex-wrap: wrap;

            margin-bottom: 20px;

        }


        .orders-header h2 {

            margin: 0;

        }


        /* =========================
           SEARCH AND FILTER
        ========================= */

        .filters {

            display: flex;

            gap: 12px;

            flex-wrap: wrap;

            margin-bottom: 20px;

        }


        #searchInput {

            flex: 1;

            min-width: 250px;

            padding: 12px 14px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 14px;

            box-sizing: border-box;

        }


        #searchInput:focus {

            outline: none;

            border-color: #8b0000;

        }


        #statusFilter {

            padding: 12px 14px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 14px;

            background-color: white;

            cursor: pointer;

            min-width: 190px;

        }


        #statusFilter:focus {

            outline: none;

            border-color: #8b0000;

        }


        /* =========================
           REFRESH BUTTON
        ========================= */

        #refreshButton {

            background-color: #8b0000;

            color: white;

            border: none;

            padding: 10px 18px;

            border-radius: 6px;

            cursor: pointer;

            font-size: 14px;

        }


        #refreshButton:hover {

            background-color: #a50000;

        }


        /* =========================
           TABLE
        ========================= */

        .table-container {

            overflow-x: auto;

        }


        table {

            width: 100%;

            border-collapse: collapse;

            margin-top: 20px;

            min-width: 1150px;

        }


        th,
        td {

            padding: 14px;

            border-bottom: 1px solid #ddd;

            text-align: left;

            vertical-align: top;

        }


        th {

            background-color: #8b0000;

            color: white;

        }


        tr:hover {

            background-color: #f9f9f9;

        }


        /* =========================
           ORDER ID
        ========================= */

        .order-id {

            font-weight: bold;

            color: #8b0000;

            white-space: nowrap;

        }


        /* =========================
           CUSTOMER INFORMATION
        ========================= */

        .customer-name {

            font-weight: bold;

            color: #8b0000;

        }


        .phone {

            margin-top: 5px;

        }


        .address {

            max-width: 220px;

            line-height: 1.5;

        }


        /* =========================
           ORDER ITEMS
        ========================= */

        .order-item {

            margin-bottom: 8px;

            padding-bottom: 8px;

            border-bottom: 1px solid #eee;

        }


        .order-item:last-child {

            border-bottom: none;

        }


        .item-name {

            font-weight: bold;

        }


        .item-quantity {

            color: #555;

        }


        /* =========================
           TOTAL
        ========================= */

        .order-total {

            font-weight: bold;

            color: #8b0000;

            font-size: 16px;

        }


        /* =========================
           STATUS AREA
        ========================= */

        .status-select {

            padding: 9px;

            border-radius: 7px;

            border: 1px solid #ccc;

            font-size: 14px;

            cursor: pointer;

            width: 160px;

            background-color: white;

        }


        .status-select:focus {

            outline: none;

            border-color: #8b0000;

        }


        .status-message {

            display: block;

            margin-top: 8px;

            font-size: 12px;

            font-weight: bold;

        }


        .status-success {

            color: green;

        }


        .status-error {

            color: #b00020;

        }


        /* =========================
           DELIVERY DATE
        ========================= */

        .delivery-date {

            font-weight: bold;

        }


        /* =========================
           LOADING
        ========================= */

        .loading {

            text-align: center;

            padding: 30px;

            font-size: 16px;

        }


        /* =========================
           ERROR
        ========================= */

        .error {

            text-align: center;

            padding: 30px;

            color: #b00020;

        }


        /* =========================
           NO RESULTS
        ========================= */

        .no-results {

            text-align: center;

            padding: 30px;

            color: #666;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .dashboard {

                padding: 15px;

            }


            .stats {

                grid-template-columns: 1fr;

            }


            .header-content {

                flex-direction: column;

                text-align: center;

            }


            header h1 {

                font-size: 24px;

            }


            .orders-container {

                padding: 15px;

            }


            .filters {

                flex-direction: column;

            }


            #searchInput,
            #statusFilter {

                width: 100%;

                min-width: 0;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header>

        <div class="header-content">

            <div>

                <h1>Ola's Fastfood</h1>

                <p>Admin Dashboard</p>

            </div>


            <button id="logoutButton">

                🚪 Logout

            </button>

        </div>

    </header>



    <!-- =========================
         DASHBOARD
    ========================= -->

    <main class="dashboard">


        <!-- =========================
             NEW ORDER NOTIFICATION
        ========================= -->

        <div id="notification">

            🔔 New order received!

        </div>



        <!-- =========================
             STATISTICS
        ========================= -->

        <section class="stats">


            <div class="stat-card">

                <h2 id="totalOrders">0</h2>

                <p>Total Orders</p>

            </div>


            <div class="stat-card">

                <h2 id="todayOrders">0</h2>

                <p>Today's Orders</p>

            </div>


            <div class="stat-card">

                <h2 id="pendingOrders">0</h2>

                <p>Pending Orders</p>

            </div>


            <div class="stat-card">

                <h2 id="deliveredOrders">0</h2>

                <p>Delivered Orders</p>

            </div>


            <div class="stat-card">

                <h2 id="totalSales">₦0.00</h2>

                <p>Total Sales</p>

            </div>


            <div class="stat-card">

                <h2 id="todaySales">₦0.00</h2>

                <p>Today's Sales</p>

            </div>


        </section>



        <!-- =========================
             ORDERS
        ========================= -->

        <section class="orders-container">


            <div class="orders-header">

                <h2>Customer Orders</h2>


                <button id="refreshButton">

                    🔄 Refresh Orders

                </button>

            </div>



            <!-- =========================
                 SEARCH AND FILTER
            ========================= -->

            <div class="filters">


                <input

                    type="text"

                    id="searchInput"

                    placeholder="🔍 Search order ID, customer, phone or address..."

                >


                <select id="statusFilter">


                    <option value="All">

                        📋 All Orders

                    </option>


                    <option value="Pending">

                        🟡 Pending

                    </option>


                    <option value="Confirmed">

                        🔵 Confirmed

                    </option>


                    <option value="Preparing">

                        🟠 Preparing

                    </option>


                    <option value="Out for Delivery">

                        🚚 Out for Delivery

                    </option>


                    <option value="Delivered">

                        🟢 Delivered

                    </option>


                </select>


            </div>



            <div class="table-container">


                <table>


                    <thead>

                        <tr>

                            <th>Order ID</th>

                            <th>Customer</th>

                            <th>Address</th>

                            <th>Order</th>

                            <th>Total</th>

                            <th>Delivery Date</th>

                            <th>Status</th>

                        </tr>

                    </thead>


                    <tbody id="ordersTable">


                        <tr>

                            <td

                                colspan="7"

                                class="loading"

                            >

                                Checking login... 🔐

                            </td>

                        </tr>


                    </tbody>


                </table>


            </div>


        </section>


    </main>



    <!-- =========================
         SUPABASE
    ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>


        // =========================
        // SUPABASE CONNECTION
        // =========================

        const SUPABASE_URL =
            "https://egycijohrzwridwjxkgy.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_FnnhxukxfnV_nj053jGnQA_R9XM3wZ6";


        const supabaseClient =
            supabase.createClient(

                SUPABASE_URL,

                SUPABASE_KEY

            );



        // =========================
        // STORE ORDERS
        // =========================

        let allOrders = [];


        let previousOrderIds = new Set();


        let firstLoad = true;



        // =========================
        // MONEY FORMAT
        // =========================

        function formatMoney(amount) {

            return "₦" +

                Number(amount || 0).toLocaleString(

                    "en-NG",

                    {

                        minimumFractionDigits: 2,

                        maximumFractionDigits: 2

                    }

                );

        }



        // =========================
        // ESCAPE HTML
        // =========================

        function escapeHTML(value) {

            const div =
                document.createElement("div");


            div.textContent =
                value;


            return div.innerHTML;

        }



        // =========================
        // CREATE ORDER ID
        // =========================

        function createOrderID(orderId) {


            // If Supabase ID is a number

            if (

                typeof orderId === "number" ||

                !isNaN(Number(orderId))

            ) {

                return (

                    "OLA-" +

                    String(orderId)

                        .padStart(6, "0")

                );

            }


            // If Supabase uses UUID

            const shortId =
                String(orderId)

                    .replace(/-/g, "")

                    .substring(0, 8)

                    .toUpperCase();


            return "OLA-" + shortId;

        }



        // =========================
        // CHECK ADMIN LOGIN
        // =========================

        async function checkAdminLogin() {


            const {

                data: {

                    user

                }

            } = await supabaseClient.auth

                .getUser();



            if (!user) {

                window.location.href =
                    "admin-login.html";

                return false;

            }


            console.log(

                "Admin logged in:",

                user.email

            );


            return true;

        }



        // =========================
        // CHECK FOR NEW ORDERS
        // =========================

        function checkForNewOrders(orders) {


            const currentOrderIds =
                new Set(

                    orders.map(

                        function(order) {

                            return String(
                                order.id
                            );

                        }

                    )

                );


            // Don't notify on the first page load

            if (firstLoad) {

                previousOrderIds =
                    currentOrderIds;

                firstLoad = false;

                return;

            }


            let newOrders = [];


            orders.forEach(

                function(order) {


                    const id =
                        String(order.id);


                    if (

                        !previousOrderIds.has(id)

                    ) {

                        newOrders.push(order);

                    }

                }

            );


            previousOrderIds =
                currentOrderIds;



            if (newOrders.length > 0) {

                showNewOrderNotification(

                    newOrders.length

                );

            }

        }



        // =========================
        // SHOW NEW ORDER NOTIFICATION
        // =========================

        function showNewOrderNotification(count) {


            const notification =
                document.getElementById(
                    "notification"
                );


            if (count === 1) {

                notification.textContent =
                    "🔔 New order received!";

            } else {

                notification.textContent =
                    "🔔 " +
                    count +
                    " new orders received!";

            }


            notification.style.display =
                "block";


            // Browser notification

            if (

                "Notification" in window &&

                Notification.permission ===
                "granted"

            ) {

                new Notification(

                    "Ola's Fastfood",

                    {

                        body:
                            count === 1

                                ? "You have a new customer order."

                                : "You have " +
                                  count +
                                  " new customer orders."

                    }

                );

            }


            // Hide notification after 8 seconds

            setTimeout(

                function() {

                    notification.style.display =
                        "none";

                },

                8000

            );

        }



        // =========================
        // REQUEST NOTIFICATION
        // PERMISSION
        // =========================

        function requestNotificationPermission() {


            if (

                "Notification" in window &&

                Notification.permission ===
                "default"

            ) {

                Notification.requestPermission();

            }

        }



        // =========================
        // LOAD ORDERS
        // =========================

        async function loadOrders() {


            const ordersTable =
                document.getElementById(
                    "ordersTable"
                );


            ordersTable.innerHTML = `

                <tr>

                    <td

                        colspan="7"

                        class="loading"

                    >

                        Loading orders... ⏳

                    </td>

                </tr>

            `;



            try {


                const {

                    data,

                    error

                } = await supabaseClient

                    .from("orders")

                    .select("*");



                if (error) {

                    console.error(

                        "Supabase error:",

                        error

                    );

                    throw error;

                }



                allOrders =
                    data || [];


                // Check for new orders

                checkForNewOrders(
                    allOrders
                );


                // Update statistics

                updateStatistics(
                    allOrders
                );


                // Display

                displayOrders();



            } catch (error) {


                console.error(

                    "Could not load orders:",

                    error

                );


                ordersTable.innerHTML = `

                    <tr>

                        <td

                            colspan="7"

                            class="error"

                        >

                            ❌ Could not load orders.

                            <br><br>

                            Check the browser console
                            for more information.

                        </td>

                    </tr>

                `;

            }

        }



        // =========================
        // DISPLAY ORDERS
        // =========================

        function displayOrders() {


            const ordersTable =
                document.getElementById(
                    "ordersTable"
                );


            const searchInput =
                document.getElementById(
                    "searchInput"
                );


            const statusFilter =
                document.getElementById(
                    "statusFilter"
                );


            const searchText =
                searchInput.value

                    .trim()

                    .toLowerCase();


            const selectedStatus =
                statusFilter.value;



            // =========================
            // FILTER
            // =========================

            const filteredOrders =
                allOrders.filter(

                    function(order) {


                        const orderID =
                            createOrderID(
                                order.id
                            ).toLowerCase();


                        const customerName =
                            String(

                                order.customer_name ||

                                ""

                            ).toLowerCase();


                        const phone =
                            String(

                                order.phone ||

                                ""

                            ).toLowerCase();


                        const address =
                            String(

                                order.address ||

                                ""

                            ).toLowerCase();


                        const orderStatus =
                            order.status ||
                            "Pending";


                        const matchesSearch =

                            orderID.includes(
                                searchText
                            ) ||

                            customerName.includes(
                                searchText
                            ) ||

                            phone.includes(
                                searchText
                            ) ||

                            address.includes(
                                searchText
                            );


                        const matchesStatus =

                            selectedStatus ===
                            "All" ||

                            orderStatus ===
                            selectedStatus;



                        return (

                            matchesSearch &&

                            matchesStatus

                        );

                    }

                );



            // =========================
            // NO RESULTS
            // =========================

            if (

                filteredOrders.length === 0

            ) {


                ordersTable.innerHTML = `

                    <tr>

                        <td

                            colspan="7"

                            class="no-results"

                        >

                            🔍 No orders match your search.

                        </td>

                    </tr>

                `;


                return;

            }



            ordersTable.innerHTML = "";



            // =========================
            // DISPLAY
            // =========================

            filteredOrders.forEach(

                function(order) {


                    const row =
                        document.createElement(
                            "tr"
                        );



                    // =========================
                    // ORDER ID
                    // =========================

                    const orderIDCell =
                        document.createElement(
                            "td"
                        );


                    orderIDCell.innerHTML = `

                        <span class="order-id">

                            ${escapeHTML(

                                createOrderID(
                                    order.id
                                )

                            )}

                        </span>

                    `;



                    // =========================
                    // CUSTOMER
                    // =========================

                    const customerCell =
                        document.createElement(
                            "td"
                        );


                    customerCell.innerHTML = `

                        <div class="customer-name">

                            ${escapeHTML(

                                order.customer_name ||

                                "N/A"

                            )}

                        </div>


                        <div class="phone">

                            📞 ${escapeHTML(

                                order.phone ||

                                "N/A"

                            )}

                        </div>

                    `;



                    // =========================
                    // ADDRESS
                    // =========================

                    const addressCell =
                        document.createElement(
                            "td"
                        );


                    addressCell.innerHTML = `

                        <div class="address">

                            ${escapeHTML(

                                order.address ||

                                "N/A"

                            )}

                        </div>

                    `;



                    // =========================
                    // ITEMS
                    // =========================

                    const itemsCell =
                        document.createElement(
                            "td"
                        );


                    let items =
                        order.items;


                    if (

                        typeof items ===
                        "string"

                    ) {

                        try {

                            items =
                                JSON.parse(items);

                        } catch (error) {

                            items = [];

                        }

                    }



                    let itemsHTML = "";



                    if (

                        Array.isArray(items) &&

                        items.length > 0

                    ) {


                        items.forEach(

                            function(item) {


                                itemsHTML += `

                                    <div class="order-item">

                                        <div class="item-name">

                                            ${escapeHTML(

                                                item.name ||

                                                "Item"

                                            )}

                                        </div>


                                        <div class="item-quantity">

                                            Quantity:

                                            ${Number(

                                                item.quantity ||

                                                0

                                            )}

                                        </div>


                                        <div>

                                            ${formatMoney(

                                                item.total

                                            )}

                                        </div>

                                    </div>

                                `;

                            }

                        );


                    } else {

                        itemsHTML =
                            "No item details";

                    }



                    itemsCell.innerHTML =
                        itemsHTML;



                    // =========================
                    // TOTAL
                    // =========================

                    const totalCell =
                        document.createElement(
                            "td"
                        );


                    totalCell.innerHTML = `

                        <span class="order-total">

                            ${formatMoney(

                                order.total

                            )}

                        </span>

                    `;



                    // =========================
                    // DELIVERY DATE
                    // =========================

                    const dateCell =
                        document.createElement(
                            "td"
                        );


                    dateCell.innerHTML = `

                        <span class="delivery-date">

                            ${escapeHTML(

                                order.delivery_date ||

                                "N/A"

                            )}

                        </span>

                    `;



                    // =========================
                    // STATUS
                    // =========================

                    const statusCell =
                        document.createElement(
                            "td"
                        );


                    const statusSelect =
                        document.createElement(
                            "select"
                        );


                    statusSelect.className =
                        "status-select";


                    const statuses = [

                        "Pending",

                        "Confirmed",

                        "Preparing",

                        "Out for Delivery",

                        "Delivered"

                    ];



                    statuses.forEach(

                        function(status) {


                            const option =
                                document.createElement(
                                    "option"
                                );


                            option.value =
                                status;


                            option.textContent =
                                status;


                            if (

                                (

                                    order.status ||

                                    "Pending"

                                ) === status

                            ) {

                                option.selected =
                                    true;

                            }


                            statusSelect.appendChild(
                                option
                            );

                        }

                    );



                    const statusMessage =
                        document.createElement(
                            "span"
                        );


                    statusMessage.className =
                        "status-message";



                    statusSelect.addEventListener(

                        "change",

                        function() {


                            updateOrderStatus(

                                order.id,

                                statusSelect.value,

                                statusMessage

                            );

                        }

                    );



                    statusCell.appendChild(
                        statusSelect
                    );


                    statusCell.appendChild(
                        statusMessage
                    );



                    // =========================
                    // ADD CELLS
                    // =========================

                    row.appendChild(
                        orderIDCell
                    );


                    row.appendChild(
                        customerCell
                    );


                    row.appendChild(
                        addressCell
                    );


                    row.appendChild(
                        itemsCell
                    );


                    row.appendChild(
                        totalCell
                    );


                    row.appendChild(
                        dateCell
                    );


                    row.appendChild(
                        statusCell
                    );


                    ordersTable.appendChild(
                        row
                    );

                }

            );

        }



        // =========================
        // UPDATE ORDER STATUS
        // =========================

        async function updateOrderStatus(

            orderId,

            newStatus,

            messageElement

        ) {


            messageElement.className =
                "status-message";


            messageElement.textContent =
                "Saving... ⏳";



            try {


                const {

                    error

                } = await supabaseClient

                    .from("orders")

                    .update({

                        status: newStatus

                    })

                    .eq(

                        "id",

                        orderId

                    );



                if (error) {

                    console.error(

                        "Status update error:",

                        error

                    );

                    throw error;

                }



                messageElement.className =
                    "status-message status-success";


                messageElement.textContent =
                    "Saved ✓";



                const order =
                    allOrders.find(

                        function(item) {

                            return (

                                item.id ===
                                orderId

                            );

                        }

                    );


                if (order) {

                    order.status =
                        newStatus;

                }



                updateStatistics(
                    allOrders
                );


                displayOrders();



            } catch (error) {


                console.error(

                    "Could not update status:",

                    error

                );


                messageElement.className =
                    "status-message status-error";


                messageElement.textContent =
                    "❌ Could not save";

            }

        }



        // =========================
        // GET TODAY'S DATE
        // =========================

        function getTodayDate() {


            const today =
                new Date();


            const year =
                today.getFullYear();


            const month =
                String(

                    today.getMonth() + 1

                ).padStart(

                    2,

                    "0"

                );


            const day =
                String(

                    today.getDate()

                ).padStart(

                    2,

                    "0"

                );


            return (

                year +

                "-" +

                month +

                "-" +

                day

            );

        }



        // =========================
        // STATISTICS
        // =========================

        function updateStatistics(orders) {


            const today =
                getTodayDate();



            // TOTAL ORDERS

            const totalOrders =
                orders.length;



            // TODAY'S ORDERS

            const todayOrders =
                orders.filter(

                    function(order) {


                        return (

                            order.delivery_date ===
                            today

                        );

                    }

                ).length;



            // PENDING

            const pendingOrders =
                orders.filter(

                    function(order) {


                        return (

                            !order.status ||

                            order.status
                                .toLowerCase() ===
                            "pending"

                        );

                    }

                ).length;



            // DELIVERED

            const deliveredOrders =
                orders.filter(

                    function(order) {


                        return (

                            String(

                                order.status ||

                                ""

                            ).toLowerCase() ===
                            "delivered"

                        );

                    }

                ).length;



            // TOTAL SALES

            const totalSales =
                orders.reduce(

                    function(sum, order) {


                        return (

                            sum +

                            Number(

                                order.total ||

                                0

                            )

                        );

                    },

                    0

                );



            // TODAY'S SALES

            const todaySales =
                orders.reduce(

                    function(sum, order) {


                        if (

                            order.delivery_date ===
                            today

                        ) {

                            return (

                                sum +

                                Number(

                                    order.total ||

                                    0

                                )

                            );

                        }


                        return sum;

                    },

                    0

                );



            // DISPLAY

            document.getElementById(

                "totalOrders"

            ).textContent =

                totalOrders;



            document.getElementById(

                "todayOrders"

            ).textContent =

                todayOrders;



            document.getElementById(

                "pendingOrders"

            ).textContent =

                pendingOrders;



            document.getElementById(

                "deliveredOrders"

            ).textContent =

                deliveredOrders;



            document.getElementById(

                "totalSales"

            ).textContent =

                formatMoney(

                    totalSales

                );



            document.getElementById(

                "todaySales"

            ).textContent =

                formatMoney(

                    todaySales

                );

        }



        // =========================
        // SEARCH
        // =========================

        document.getElementById(

            "searchInput"

        ).addEventListener(

            "input",

            function() {

                displayOrders();

            }

        );



        // =========================
        // STATUS FILTER
        // =========================

        document.getElementById(

            "statusFilter"

        ).addEventListener(

            "change",

            function() {

                displayOrders();

            }

        );



        // =========================
        // REFRESH
        // =========================

        document.getElementById(

            "refreshButton"

        ).addEventListener(

            "click",

            loadOrders

        );



        // =========================
        // LOGOUT
        // =========================

        document.getElementById(

            "logoutButton"

        ).addEventListener(

            "click",

            async function() {


                await supabaseClient.auth
                    .signOut();


                window.location.href =
                    "admin-login.html";

            }

        );



        // =========================
        // START DASHBOARD
        // =========================

        async function startDashboard() {


            const loggedIn =
                await checkAdminLogin();


            if (!loggedIn) {

                return;

            }


            requestNotificationPermission();


            await loadOrders();


            // Check for new orders

            // every 30 seconds

            setInterval(

                loadOrders,

                30000

            );

        }



        startDashboard();


    </script>


</body>
